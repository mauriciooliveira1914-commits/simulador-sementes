<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Preços - RTV</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}
.container{max-width:900px;margin:0 auto;padding:16px}
.header{background:#1f4e79;color:white;padding:18px;border-radius:12px;margin-bottom:16px}
.header h1{margin:0 0 5px;font-size:22px}.header p{margin:0;opacity:.9;font-size:14px}
.card{background:white;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px}
select,input,button{width:100%;min-height:44px;border:1px solid #ccd2d8;border-radius:8px;padding:10px;font-size:15px;background:white}
button{margin-top:14px;background:#1f4e79;color:white;border:0;font-weight:bold;cursor:pointer}
.hidden{display:none}.result-title{font-size:18px;font-weight:bold;margin-bottom:10px}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:10px 8px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:14px}
th{background:#eef3f7;font-weight:bold}.price{font-weight:bold;white-space:nowrap}
.info{background:#fff8e1;border-left:4px solid #f0ad00;padding:10px;font-size:13px;margin-top:12px;border-radius:6px}
.empty{padding:20px;text-align:center;color:#666}
@media(max-width:650px){.container{padding:10px}.grid{grid-template-columns:1fr}.header h1{font-size:20px}.card{padding:13px}}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>Simulador de Preços - RTV</h1><p>Consulta de preços de sementes</p></div>
<div class="card">
<div class="grid">
<div class="field"><label for="vencimento">Vencimento</label><select id="vencimento"><option value="">Selecione...</option></select></div>
<div class="field"><label for="regiao">Região de Venda</label><select id="regiao"><option value="">Selecione...</option></select></div>
<div class="field"><label for="embalagem">Embalagem</label><select id="embalagem"><option value="">Selecione...</option><option value="BAG">BAG</option><option value="SACA">SACA</option></select></div>
<div class="field"><label for="frete">Frete</label><select id="frete"><option value="">Selecione...</option><option value="FOB">FOB</option><option value="CIF">CIF</option></select></div>
<div class="field hidden" id="campoFreteCif"><label for="valorFrete">Valor do Frete CIF (R$)</label><input type="number" id="valorFrete" min="0" step="0.01" placeholder="Ex.: 250,00"></div>
<div class="field"><label for="tipoTSI">Tipo de TSI</label><select id="tipoTSI"><option value="TSI_1">TSI 1</option><option value="TSI_2">TSI 2</option><option value="TSI_3">TSI 3</option><option value="TSI_4">TSI 4</option><option value="TSI_5">TSI 5</option><option value="TSI_6">TSI 6</option></select></div>
</div>
<button onclick="calcular()">CALCULAR PREÇOS</button>
<div class="info">Esta versão usa dados demonstrativos dentro do próprio HTML. Depois podemos substituir esta base pela sua planilha Excel.</div>
</div>
<div class="card">
<div class="result-title">Resultado</div>
<div id="mensagem" class="empty">Preencha os filtros e clique em CALCULAR PREÇOS.</div>
<div class="table-wrap"><table id="tabelaResultado" class="hidden"><thead><tr><th>Variedade</th><th>Embalagem</th><th>Preço Branca</th><th>Preço TSI</th></tr></thead><tbody id="resultado"></tbody></table></div>
</div>
</div>
<script>
const basePrecos=[
{vencimento:"30/09/2026",regiao:"REGIAO 1",variedade:"64I61RSF IPRO",embalagem:"BAG",branca:10000,TSI_1:10300,TSI_2:10400,TSI_3:10500,TSI_4:10600,TSI_5:10700,TSI_6:10800},
{vencimento:"30/09/2026",regiao:"REGIAO 1",variedade:"S25S2C59001",embalagem:"BAG",branca:9800,TSI_1:10100,TSI_2:10200,TSI_3:10300,TSI_4:10400,TSI_5:10500,TSI_6:10600},
{vencimento:"30/09/2026",regiao:"REGIAO 1",variedade:"CC71SJ26P4168",embalagem:"SACA",branca:250,TSI_1:265,TSI_2:270,TSI_3:275,TSI_4:280,TSI_5:285,TSI_6:290},
{vencimento:"30/10/2026",regiao:"REGIAO 2",variedade:"64I61RSF IPRO",embalagem:"BAG",branca:10200,TSI_1:10500,TSI_2:10600,TSI_3:10700,TSI_4:10800,TSI_5:10900,TSI_6:11000}
];

function carregarFiltros(){
const vencimentos=[...new Set(basePrecos.map(x=>x.vencimento))];
const regioes=[...new Set(basePrecos.map(x=>x.regiao))];
vencimentos.forEach(v=>{let o=document.createElement("option");o.value=v;o.textContent=v;document.getElementById("vencimento").appendChild(o)});
regioes.forEach(v=>{let o=document.createElement("option");o.value=v;o.textContent=v;document.getElementById("regiao").appendChild(o)});
}
document.getElementById("frete").addEventListener("change",function(){
const c=document.getElementById("campoFreteCif");
if(this.value==="CIF")c.classList.remove("hidden");else{c.classList.add("hidden");document.getElementById("valorFrete").value=""}
});
function calcular(){
const vencimento=document.getElementById("vencimento").value,regiao=document.getElementById("regiao").value,embalagem=document.getElementById("embalagem").value,frete=document.getElementById("frete").value,tipoTSI=document.getElementById("tipoTSI").value;
let valorFrete=frete==="CIF"?(Number(document.getElementById("valorFrete").value)||0):0;
if(!vencimento||!regiao||!embalagem||!frete){document.getElementById("mensagem").textContent="Preencha todos os campos obrigatórios.";document.getElementById("tabelaResultado").classList.add("hidden");return}
const resultados=basePrecos.filter(x=>x.vencimento===vencimento&&x.regiao===regiao&&x.embalagem===embalagem);
const tbody=document.getElementById("resultado");tbody.innerHTML="";
if(!resultados.length){document.getElementById("mensagem").textContent="Nenhum preço encontrado para os filtros selecionados.";document.getElementById("tabelaResultado").classList.add("hidden");return}
document.getElementById("mensagem").textContent=resultados.length+" variedade(s) encontrada(s).";
resultados.forEach(item=>{
const tr=document.createElement("tr");
tr.innerHTML=`<td><strong>${item.variedade}</strong></td><td>${item.embalagem}</td><td class="price">${formatarMoeda(Number(item.branca)+valorFrete)}</td><td class="price">${formatarMoeda(Number(item[tipoTSI])+valorFrete)}</td>`;
tbody.appendChild(tr);
});
document.getElementById("tabelaResultado").classList.remove("hidden");
}
function formatarMoeda(valor){return Number(valor).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
carregarFiltros();
</script>
</body>
</html>
